name: Packages

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "debian/**"
      - "packaging/**"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/packages.yml"

permissions:
  contents: read

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and install package
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel git python python-build python-hatchling \
            python-installer python-wheel python-typer python-rich python-pydantic \
            python-sqlalchemy python-platformdirs python-httpx python-yaml pacman-contrib

          version=$(python3 -c "import ast,pathlib; m=ast.parse(pathlib.Path('src/refhound/_version.py').read_text()); print(next(ast.literal_eval(n.value) for n in m.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', '') == '__version__' for t in n.targets)))")

          # checkout falls back to a source tarball when the image has no git,
          # so build the release tarball from the working tree instead of git.
          # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble ._ members.
          export COPYFILE_DISABLE=1
          stage=$(mktemp -d)
          tree="$stage/RefHound-$version"
          mkdir -p "$tree"
          cp -a "$GITHUB_WORKSPACE/." "$tree/"
          rm -rf "$tree/.git" "$tree/artifacts" "$tree/.venv" "$tree/dist" \
            "$tree/build" "$tree/docs/_build" "$tree/.pytest_cache" "$tree/.ruff_cache" \
            "$tree/.mypy_cache" "$tree/.pybuild" "$tree/debian/.debhelper" \
            "$tree/debian/refhound"
          find "$tree" -name __pycache__ -type d -prune -exec rm -rf {} +
          find "$tree" -name '*.egg-info' -type d -prune -exec rm -rf {} +
          # macOS resource forks, for local runs of this recipe.
          find "$tree" -name '._*' -delete
          mkdir -p artifacts/source
          tar -czf "artifacts/source/refhound-$version.tar.gz" -C "$stage" "RefHound-$version"
          rm -rf "$stage"

          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          chmod -R a+rX artifacts

          su builder -s /bin/bash -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE/packaging/arch'
            REFHOUND_LOCAL_TARBALL='$GITHUB_WORKSPACE/artifacts/source/refhound-$version.tar.gz' \
              makepkg -f --noconfirm
          "

          mkdir -p artifacts/arch
          cp packaging/arch/refhound-*.pkg.tar.zst artifacts/arch/
          pacman -U --noconfirm artifacts/arch/refhound-*.pkg.tar.zst
          sh packaging/smoke.sh
          pacman -U --noconfirm artifacts/arch/refhound-*.pkg.tar.zst
          sh packaging/smoke.sh
          pacman -R --noconfirm refhound
          ! command -v refhound

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-arch
          path: artifacts/arch/*.pkg.tar.zst

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and install package
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper dh-python git lintian \
            pybuild-plugin-pyproject python3-all python3-hatchling python3-typer \
            python3-rich python3-pydantic python3-sqlalchemy python3-platformdirs \
            python3-httpx python3-yaml

          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts/debian
          cp ../refhound_*.deb artifacts/debian/

          apt-get install -y ./artifacts/debian/refhound_*.deb
          sh packaging/smoke.sh
          apt-get install -y --reinstall ./artifacts/debian/refhound_*.deb
          sh packaging/smoke.sh
          lintian --fail-on error artifacts/debian/refhound_*.deb
          apt-get remove -y refhound
          ! command -v refhound

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-debian
          path: artifacts/debian/*.deb

  rpm:
    name: RPM package (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            artifact: rpm-fedora
          - image: opensuse/tumbleweed:latest
            artifact: rpm-opensuse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build tools
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf install -y git tar gzip rpm-build python3-devel pyproject-rpm-macros \
              python3-hatchling python3-typer python3-rich python3-pydantic \
              python3-sqlalchemy python3-platformdirs python3-httpx python3-pyyaml
          else
            zypper --non-interactive install git tar gzip rpm-build python3-devel \
              python-rpm-macros python3-pip python3-hatchling python3-typer \
              python3-rich python3-pydantic python3-SQLAlchemy python3-platformdirs \
              python3-httpx python3-PyYAML
          fi

      - name: Build and install package
        run: |
          set -euo pipefail
          version=$(python3 -c "import ast,pathlib; m=ast.parse(pathlib.Path('src/refhound/_version.py').read_text()); print(next(ast.literal_eval(n.value) for n in m.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', '') == '__version__' for t in n.targets)))")

          # checkout falls back to a source tarball when the image has no git,
          # so build the release tarball from the working tree instead of git.
          # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble ._ members.
          export COPYFILE_DISABLE=1
          stage=$(mktemp -d)
          tree="$stage/RefHound-$version"
          mkdir -p "$tree"
          cp -a "$GITHUB_WORKSPACE/." "$tree/"
          rm -rf "$tree/.git" "$tree/artifacts" "$tree/.venv" "$tree/dist" \
            "$tree/build" "$tree/docs/_build" "$tree/.pytest_cache" "$tree/.ruff_cache" \
            "$tree/.mypy_cache" "$tree/.pybuild" "$tree/debian/.debhelper" \
            "$tree/debian/refhound"
          find "$tree" -name __pycache__ -type d -prune -exec rm -rf {} +
          find "$tree" -name '*.egg-info' -type d -prune -exec rm -rf {} +
          # macOS resource forks, for local runs of this recipe.
          find "$tree" -name '._*' -delete
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf "$HOME/rpmbuild/SOURCES/refhound-$version.tar.gz" -C "$stage" "RefHound-$version"
          rm -rf "$stage"
          rpmbuild --define "_topdir $HOME/rpmbuild" -ba packaging/rpm/refhound.spec

          mkdir -p artifacts/${{ matrix.artifact }}
          cp "$HOME"/rpmbuild/RPMS/noarch/*.rpm artifacts/${{ matrix.artifact }}/

          if command -v dnf >/dev/null; then
            dnf install -y artifacts/${{ matrix.artifact }}/*.rpm
          else
            zypper --non-interactive install --allow-unsigned-rpm artifacts/${{ matrix.artifact }}/*.rpm
          fi
          sh packaging/smoke.sh
          if command -v dnf >/dev/null; then
            dnf remove -y refhound
          else
            zypper --non-interactive remove refhound
          fi
          ! command -v refhound

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}/*.rpm
