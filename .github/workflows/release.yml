name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all gates and protected environment approvals'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  packages:
    uses: ./.github/workflows/packages.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - name: Check version and publication ref
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/release.py check
      - run: uv build --out-dir dist
      - run: python scripts/release.py verify-sdist dist
      - run: uv run --no-project --with twine twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  verify-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
        distribution: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - name: Install in an isolated environment and scan a synthetic repository
        run: uv run --no-project --python ${{ matrix.python }} python scripts/verify_distribution.py dist ${{ matrix.distribution }}

  manifest:
    needs: [ci, packages, build, verify-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded
          pattern: '{python-dist,package-*}'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - name: Generate Python environment SBOM
        run: |
          uv venv "$RUNNER_TEMP/sbom-env"
          uv pip install --python "$RUNNER_TEMP/sbom-env/bin/python" downloaded/python-dist/*.whl
          mkdir -p downloaded/sbom
          uvx --from cyclonedx-bom==7.2.1 cyclonedx-py environment "$RUNNER_TEMP/sbom-env/bin/python" --output-file downloaded/sbom/python-sbom.cdx.json
      - name: Create and verify flat release assets
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/release.py manifest downloaded release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  pypi:
    needs: [ci, packages, build, verify-install, manifest]
    if: inputs.publish && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/refhound
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          print-hash: true

  github-release:
    needs: [pypi, manifest]
    if: inputs.publish && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/*
      - name: Verify checksums and create a new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --title "RefHound $RELEASE_TAG" --generate-notes release-assets/*
