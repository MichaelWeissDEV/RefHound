name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/refhound
      - run: uv run pytest --cov=refhound --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.xml

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - name: Run tests
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=line -rf > pytest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 150 pytest.log
            # Job logs need repository admin rights; annotations are readable.
            # Emit the failure output as one annotation so CI failures can be
            # diagnosed without log access.
            body=$(tail -n 120 pytest.log)
            body=${body//'%'/%25}
            body=${body//$'\r'/}
            body=${body//$'\n'/%0A}
            body=${body:0:60000}
            echo "::error title=pytest failures::$body"
          fi
          exit "$status"

  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest tests/security

  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run sphinx-build -W docs docs/_build
      - run: uv build
      - run: python scripts/release.py verify-sdist dist
      - run: uv run --isolated --with dist/*.whl refhound --version
      - run: uv run --isolated --with dist/*.whl refhound --help
      - run: uv run --isolated --with dist/*.whl refhound scan --help
      - run: uv run --isolated --with dist/*.whl refhound doctor --help
